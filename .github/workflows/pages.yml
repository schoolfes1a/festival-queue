# public/ の中身を GitHub Pages に公開する。
# main に push するたびに自動で反映される。
#
# 事前に GitHub の Settings > Pages で
#   Source = "GitHub Actions"
# を選んでおくこと（"Deploy from a branch" のままだとこのワークフローは反映されない）。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages の設定を読み込む
        uses: actions/configure-pages@v5

      - name: public/ をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
