<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1A文化祭 お客様用ページ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="site-title">1A文化祭</h1>

<!-- 呼び出し中の番号（表示設定でON/OFF） -->
<div class="card now-card" id="calling-card" hidden>
  <div class="now-label">ただいま呼び出し中の番号</div>
  <div id="calling-area"></div>
  <p class="note" style="margin:14px 0 0;">
    番号が出たら受付までお越しください。食券をご購入いただきます。
  </p>
</div>

<!-- 呼び飛ばした番号（呼び出し中を出しているときだけ） -->
<div class="card" id="skipped-card" hidden>
  <div class="now-label">お呼びしましたが、まだお越しでない番号</div>
  <div class="number-chips" id="skipped-list"></div>
  <p class="note" style="margin:12px 0 0;">
    この番号をお持ちの方は、お待たせしております。受付までお越しください。順番はお取りしてあります。
  </p>
</div>

<!-- 待ち人数・待ち時間（それぞれ表示設定でON/OFF） -->
<div class="card now-card" id="wait-card" hidden>
  <div class="wait-row">
    <div class="wait-box" id="people-box" hidden>
      <div class="wait-value" id="waiting-count">-<small>人</small></div>
      <div class="wait-label">お待ちの人数</div>
    </div>
    <div class="wait-box" id="wait-box" hidden>
      <div class="wait-value" id="waiting-minutes">-<small>分</small></div>
      <div class="wait-label">待ち時間の目安</div>
    </div>
  </div>
  <p class="updated-note">この画面は自動で更新されます</p>
</div>

<div class="card">
  <h2>メニュー</h2>
  <ul class="menu-detail-list" id="menu-view-list"></ul>
</div>

<div class="footer-login">
  <a href="login.html">スタッフの方はこちら</a>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import {
  doc, collection, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { logAccess } from "./logger.js";

logAccess("index.html");

function esc(s) {
  const div = document.createElement("div");
  div.textContent = s == null ? "" : String(s);
  return div.innerHTML;
}

// 何を出すかはスタッフが設定タブで決める。
// すべてOFFならメニューだけのページになる。
const DEFAULT_DISPLAY = {
  showTickets: true, showPeople: true, showWait: false, people: 0, waitMinutes: 0,
};
let display = { ...DEFAULT_DISPLAY };
let board = { calling: [], skipped: [] };

onSnapshot(doc(db, "state", "display"), (snap) => {
  display = { ...DEFAULT_DISPLAY, ...(snap.data() || {}) };
  render();
}, (err) => console.error("表示設定の取得に失敗しました", err));

// 番号だけを載せた公開用のドキュメント。
// 購入内容（商品・備考）はお客様の端末には送られない。
onSnapshot(doc(db, "state", "board"), (snap) => {
  const data = snap.data() || {};
  board = {
    calling: Array.isArray(data.calling) ? data.calling : [],
    skipped: Array.isArray(data.skipped) ? data.skipped : [],
  };
  render();
}, (err) => console.error("呼び出し状況の取得に失敗しました", err));

function render() {
  renderCalling();
  renderSkipped();
  renderWait();
}

function renderCalling() {
  const card = document.getElementById("calling-card");
  card.hidden = !display.showTickets;
  if (!display.showTickets) return;

  const area = document.getElementById("calling-area");
  area.innerHTML = "";

  if (board.calling.length === 0) {
    const el = document.createElement("div");
    el.className = "big-number is-empty";
    el.textContent = "ただいま呼び出し中の番号はありません";
    area.appendChild(el);
    return;
  }

  // 直近に呼ばれた番号をいちばん大きく出す
  const sorted = [...board.calling].sort((a, b) => a - b);
  const main = sorted[sorted.length - 1];

  const big = document.createElement("div");
  big.className = "big-number";
  big.textContent = main;
  area.appendChild(big);

  if (sorted.length > 1) {
    const rest = document.createElement("div");
    rest.className = "number-chips";
    rest.innerHTML = sorted.slice(0, -1)
      .map((n) => `<span class="number-chip">${esc(n)}<small>番</small></span>`).join("");
    area.appendChild(rest);

    const label = document.createElement("p");
    label.className = "note";
    label.style.margin = "10px 0 0";
    label.textContent = `上記をふくむ ${sorted.length} 件をお呼びしています。`;
    area.appendChild(label);
  }
}

function renderSkipped() {
  const card = document.getElementById("skipped-card");
  if (!display.showTickets || board.skipped.length === 0) {
    card.hidden = true;
    return;
  }
  card.hidden = false;
  document.getElementById("skipped-list").innerHTML = [...board.skipped].sort((a, b) => a - b)
    .map((n) => `<span class="number-chip is-skipped">${esc(n)}<small>番</small></span>`).join("");
}

function renderWait() {
  const people = !!display.showPeople;
  const wait = !!display.showWait;

  document.getElementById("wait-card").hidden = !(people || wait);
  document.getElementById("people-box").hidden = !people;
  document.getElementById("wait-box").hidden = !wait;

  document.getElementById("waiting-count").innerHTML =
    `${Number(display.people || 0)}<small>人</small>`;
  document.getElementById("waiting-minutes").innerHTML =
    `${Number(display.waitMinutes || 0)}<small>分</small>`;
}

// ===== メニュー =====
onSnapshot(query(collection(db, "menu"), orderBy("name")), (snap) => {
  const list = document.getElementById("menu-view-list");
  list.innerHTML = "";

  if (snap.empty) {
    list.innerHTML = `<li class="empty">準備中です</li>`;
    return;
  }

  snap.docs.forEach((d) => {
    const item = d.data();
    const li = document.createElement("li");
    li.innerHTML = `
      <div class="menu-detail-main">
        <span class="menu-detail-name">${esc(item.name)}</span>
        <span class="menu-detail-price">¥${esc(item.price)}</span>
      </div>
      ${item.description ? `<div class="menu-detail-desc">${esc(item.description)}</div>` : ""}
    `;
    list.appendChild(li);
  });
});
</script>

</body>
</html>
