<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呼び出し番号 - 1A文化祭</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="display-page">

<div class="display-wrap">
  <header class="display-head">
    <span class="display-title">1A文化祭</span>
    <span class="display-label" id="head-label">お呼びしている番号</span>
  </header>

  <main class="display-main">
    <div class="display-numbers" id="numbers">
      <div class="display-empty" id="empty">準備中です</div>
    </div>
  </main>

  <footer class="display-foot" id="foot" hidden>
    <span class="display-foot-label">お越しでない番号</span>
    <div class="display-foot-numbers" id="skipped"></div>
  </footer>
</div>

<div class="display-tools" id="tools">
  <button id="fs-btn" class="ghost small">全画面</button>
  <a class="text-link" href="index.html">お客様ページ</a>
  <span class="display-status" id="status">接続中…</span>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { logAccess } from "./logger.js";

logAccess("display.html");

const numbersEl = document.getElementById("numbers");
const skippedEl = document.getElementById("skipped");
const footEl = document.getElementById("foot");
const statusEl = document.getElementById("status");

// 番号は縦に積むので、件数で割って1件あたりの高さを決める。
// 使える高さをおよそ62vhとみて、1件だけのときは40vhで頭打ちにする。
// 小さくなりすぎたら段組みに逃がすので、下限は3.2vhで止める。
function sizeFor(count) {
  const size = Math.min(40, 62 / Math.max(1, count));
  return Math.max(3.2, size).toFixed(2) + "vh";
}

function renderCalling(list) {
  numbersEl.innerHTML = "";

  if (list.length === 0) {
    const el = document.createElement("div");
    el.className = "display-empty";
    el.textContent = "ただいまお呼びしている番号はありません";
    numbersEl.appendChild(el);
    return;
  }

  numbersEl.style.setProperty("--num-size", sizeFor(list.length));
  // 縦に並ぶので、上から番号順に読めるよう昇順にする
  [...list].sort((a, b) => a - b).forEach((n) => {
    const el = document.createElement("div");
    el.className = "display-num";
    el.textContent = n;
    numbersEl.appendChild(el);
  });
}

function renderSkipped(list) {
  if (list.length === 0) {
    footEl.hidden = true;
    return;
  }
  footEl.hidden = false;
  skippedEl.innerHTML = "";
  [...list].sort((a, b) => a - b).forEach((n) => {
    const el = document.createElement("span");
    el.className = "display-skip";
    el.textContent = n;
    skippedEl.appendChild(el);
  });
}

// お客様画面と同じ設定に従う。
// 整理券を出さない運用なら、番号の代わりに人数と待ち時間を大きく出す。
const DEFAULT_DISPLAY = {
  showTickets: true, showPeople: true, showWait: false, people: 0, waitMinutes: 0,
};
let display = { ...DEFAULT_DISPLAY };
let board = { calling: [], skipped: [] };

function touch() {
  const t = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  statusEl.textContent = `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())} 更新`;
  statusEl.classList.remove("is-error");
}

function fail(msg, err) {
  console.error(msg, err);
  statusEl.textContent = "通信が切れています";
  statusEl.classList.add("is-error");
}

function render() {
  if (display.showTickets) {
    document.getElementById("head-label").textContent = "お呼びしている番号";
    renderCalling(board.calling);
    renderSkipped(board.skipped);
    return;
  }

  // 番号を出さないときは、人数と待ち時間を並べる
  document.getElementById("head-label").textContent = "ただいまの状況";
  renderSkipped([]);

  const items = [];
  if (display.showPeople) items.push({ value: Number(display.people || 0), unit: "人", label: "お待ちの人数" });
  if (display.showWait) items.push({ value: Number(display.waitMinutes || 0), unit: "分", label: "待ち時間の目安" });

  numbersEl.innerHTML = "";
  if (items.length === 0) {
    const el = document.createElement("div");
    el.className = "display-empty";
    el.textContent = "ただいま準備中です";
    numbersEl.appendChild(el);
    return;
  }

  numbersEl.style.setProperty("--num-size", sizeFor(items.length));
  items.forEach((it) => {
    const el = document.createElement("div");
    el.className = "display-stat";
    el.innerHTML = `<span class="display-num">${it.value}<small>${it.unit}</small></span>` +
                   `<span class="display-stat-label">${it.label}</span>`;
    numbersEl.appendChild(el);
  });
}

onSnapshot(doc(db, "state", "display"), (snap) => {
  display = { ...DEFAULT_DISPLAY, ...(snap.data() || {}) };
  render();
  touch();
}, (err) => fail("表示設定の取得に失敗しました", err));

onSnapshot(doc(db, "state", "board"), (snap) => {
  const data = snap.data() || {};
  board = {
    calling: Array.isArray(data.calling) ? data.calling : [],
    skipped: Array.isArray(data.skipped) ? data.skipped : [],
  };
  render();
  touch();
}, (err) => fail("呼び出し状況の取得に失敗しました", err));

// ===== 全画面 =====
document.getElementById("fs-btn").addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (e) {
    console.error("全画面にできませんでした", e);
  }
});

document.addEventListener("fullscreenchange", () => {
  document.getElementById("fs-btn").textContent = document.fullscreenElement ? "全画面を解除" : "全画面";
});

// 操作がしばらくないとボタン類を隠す（映しっぱなしでも邪魔にならないように）
const tools = document.getElementById("tools");
let hideTimer = null;
function wake() {
  tools.classList.remove("is-idle");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => tools.classList.add("is-idle"), 4000);
}
["mousemove", "touchstart", "keydown"].forEach((ev) => document.addEventListener(ev, wake));
wake();
</script>

</body>
</html>
