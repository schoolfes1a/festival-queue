<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログ - 喫茶一瑛</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="staff-page">

<div id="shell"></div>

<main>
  <section class="card">
    <div class="tabbar" id="log-tabs">
      <button type="button" class="tab-btn active" data-log="login">ログイン履歴</button>
      <button type="button" class="tab-btn" data-log="operation">操作履歴</button>
      <button type="button" class="tab-btn" data-log="order">整理券履歴</button>
      <button type="button" class="tab-btn" data-log="access">アクセス履歴</button>
    </div>

    <h2 id="log-title"></h2>
    <p class="note" id="log-note"></p>

    <div class="log-toolbar">
      <span class="log-count" id="log-count"></span>
      <button class="ghost small" id="more-btn">さらに200件読み込む</button>
      <button class="green small" id="csv-btn">CSVダウンロード（全件）</button>
    </div>

    <div class="table-scroll">
      <table>
        <thead><tr id="log-head"></tr></thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script type="module">
import {
  db, requireStaff, mountShell, subscribeOrders, subscribeTicketState, updateNavBadges,
  esc, fmtTime, toast
} from "./app.js";
import {
  collection, onSnapshot, query, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

mountShell({ active: "logs", title: "ログ" });

const RETENTION_NOTE = "データは Firestore に全件残り続けます（自動削除されません）。";

function resultLabel(result) {
  if (result === "success") return '<span class="status-served">成功</span>';
  if (result === "failure") return '<span class="status-cancelled">失敗</span>';
  return esc(result);
}

function staffName(email) {
  return email ? esc(String(email).split("@")[0]) : "-";
}

// ===== 各ログ種別の定義 =====
// 列・CSV・説明文をここにまとめ、表示処理は共通の1本にする。
const LOGS = {
  login: {
    collection: "log_login",
    title: "ログイン履歴",
    note: "スタッフのログイン試行（成功・失敗）を記録しています。" + RETENTION_NOTE,
    columns: ["日時", "スタッフ番号", "結果"],
    row: (d) => [fmtTime(d.createdAt), d.staffNumber != null ? esc(d.staffNumber) : "-", resultLabel(d.result)],
    csv: (d) => [fmtTime(d.createdAt), d.staffNumber ?? "", d.result === "success" ? "成功" : d.result === "failure" ? "失敗" : (d.result ?? "")],
    file: "ログイン履歴",
  },
  operation: {
    collection: "log_operation",
    title: "操作履歴",
    note: "メニューの追加・編集・削除、呼び出し番号や発行カウンターの操作を記録しています。" + RETENTION_NOTE,
    columns: ["日時", "スタッフ", "操作", "詳細"],
    row: (d) => [fmtTime(d.createdAt), staffName(d.staffEmail), esc(d.action), `<span class="log-detail">${esc(d.detail)}</span>`],
    csv: (d) => [fmtTime(d.createdAt), d.staffEmail ? d.staffEmail.split("@")[0] : "", d.action ?? "", d.detail ?? ""],
    file: "操作履歴",
  },
  order: {
    collection: "log_order",
    title: "整理券履歴",
    note: "整理券の発行・食券購入・提供済み・呼び飛ばし・取消など、整理券に関する操作を記録しています。" + RETENTION_NOTE,
    columns: ["日時", "番号", "スタッフ", "操作", "詳細"],
    row: (d) => [fmtTime(d.createdAt), d.ticketNumber != null ? esc(d.ticketNumber) : "-", staffName(d.staffEmail), esc(d.action), `<span class="log-detail">${esc(d.detail)}</span>`],
    csv: (d) => [fmtTime(d.createdAt), d.ticketNumber ?? "", d.staffEmail ? d.staffEmail.split("@")[0] : "", d.action ?? "", d.detail ?? ""],
    file: "整理券履歴",
  },
  access: {
    collection: "log_access",
    title: "アクセス履歴",
    note: "お客様用ページが開かれた記録です。個人を特定する情報は含みません。" + RETENTION_NOTE,
    columns: ["日時", "ページ", "端末情報"],
    row: (d) => [fmtTime(d.createdAt), esc(d.page), `<span class="log-ua" title="${esc(d.ua)}">${esc(d.ua)}</span>`],
    csv: (d) => [fmtTime(d.createdAt), d.page ?? "", d.ua ?? ""],
    file: "アクセス履歴",
  },
};

let activeKey = "login";
let activeLimit = 200;
let unsubscribe = null;

let currentNumber = 0;

requireStaff(() => {
  // タブのバッジは「呼び出し中」の判定に呼び出し番号が要る
  subscribeTicketState((s) => { currentNumber = s.currentNumber; });
  subscribeOrders((orders) => updateNavBadges(orders, currentNumber));
  show("login");
});

// ===== 表示 =====
function show(key) {
  activeKey = key;
  activeLimit = 200;

  document.querySelectorAll("#log-tabs .tab-btn").forEach((b) =>
    b.classList.toggle("active", b.dataset.log === key));

  const cfg = LOGS[key];
  document.getElementById("log-title").textContent = cfg.title;
  document.getElementById("log-note").textContent = cfg.note;
  document.getElementById("log-head").innerHTML = cfg.columns.map((c) => `<th>${c}</th>`).join("");
  document.getElementById("log-body").innerHTML = `<tr><td colspan="${cfg.columns.length}" class="empty">読み込み中…</td></tr>`;

  subscribe();
}

function subscribe() {
  const cfg = LOGS[activeKey];
  if (unsubscribe) unsubscribe();

  unsubscribe = onSnapshot(
    query(collection(db, cfg.collection), orderBy("createdAt", "desc"), limit(activeLimit)),
    (snap) => {
      const tbody = document.getElementById("log-body");
      tbody.innerHTML = "";

      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="${cfg.columns.length}" class="empty">記録がありません</td></tr>`;
      } else {
        snap.docs.forEach((d) => {
          const tr = document.createElement("tr");
          tr.innerHTML = cfg.row(d.data()).map((c) => `<td>${c}</td>`).join("");
          tbody.appendChild(tr);
        });
      }

      const reachedLimit = snap.docs.length >= activeLimit;
      document.getElementById("log-count").textContent = reachedLimit
        ? `${snap.docs.length}件を表示中（まだあります）`
        : `${snap.docs.length}件（全件表示中）`;
      document.getElementById("more-btn").hidden = !reachedLimit;
    },
    (err) => {
      console.error(err);
      toast("ログの取得に失敗しました", "err");
    }
  );
}

document.querySelectorAll("#log-tabs .tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => show(btn.dataset.log));
});

document.getElementById("more-btn").addEventListener("click", () => {
  activeLimit += 200;
  subscribe();
});

// ===== CSV出力 =====
function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCsv(headers, rows) {
  const lines = [headers.map(csvCell).join(",")];
  rows.forEach((r) => lines.push(r.map(csvCell).join(",")));
  // Excelで文字化けしないようUTF-8 BOMを付与
  return "﻿" + lines.join("\r\n");
}

function todayStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}

document.getElementById("csv-btn").addEventListener("click", async (e) => {
  const cfg = LOGS[activeKey];
  const btn = e.currentTarget;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "取得中…";

  try {
    // limit を付けず、Firestore に残っている全件を取得する
    const snap = await getDocs(query(collection(db, cfg.collection), orderBy("createdAt", "desc")));
    const csv = toCsv(cfg.columns, snap.docs.map((d) => cfg.csv(d.data())));

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${cfg.file}_${todayStr()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error(err);
    toast("CSVの取得に失敗しました。時間をおいて再度お試しください", "err");
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});
</script>

</body>
</html>
