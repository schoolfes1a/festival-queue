<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集計 - 1A文化祭</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="staff-page narrow">

<div id="shell"></div>

<main>

  <section class="card">
    <div class="card-header">
      <h2>集計</h2>
      <div class="tabbar" style="margin:0;">
        <button type="button" class="tab-btn active" data-range="today">本日</button>
        <button type="button" class="tab-btn" data-range="all">全期間</button>
      </div>
    </div>
    <p class="note" id="range-note"></p>

    <div class="stat-row">
      <div class="stat">
        <div class="stat-value" id="c-issued">0</div>
        <div class="stat-label">発行した整理券</div>
      </div>
      <div class="stat">
        <div class="stat-value status-purchased" id="c-bought">0</div>
        <div class="stat-label">食券を買った組</div>
      </div>
    </div>

    <div class="stat-row" style="margin-top:10px;">
      <div class="stat" id="served-stat">
        <div class="stat-value status-served" id="c-served">0</div>
        <div class="stat-label">提供した組</div>
      </div>
      <div class="stat">
        <div class="stat-value status-skipped" id="c-skipped">0</div>
        <div class="stat-label">呼び飛ばし</div>
      </div>
      <div class="stat">
        <div class="stat-value status-cancelled" id="c-cancelled">0</div>
        <div class="stat-label">取消</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2>工程ごとの通過数</h2>
      <button id="csv-btn" class="green small">CSVダウンロード</button>
    </div>
    <p class="note">発行した整理券のうち、どこまで進んだかの内訳です。</p>
    <div id="funnel"></div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2>時間帯ごとの食券</h2>
    </div>
    <p class="note">食券を買った時刻でまとめています。混んだ時間帯の目安になります。</p>
    <div id="hourly"></div>
  </section>

</main>

<script type="module">
import {
  requireStaff, mountShell, subscribeOrders, subscribeTicketState, subscribeConfig,
  updateNavBadges, esc, isToday, toast, DEFAULT_CONFIG
} from "./app.js";

mountShell({ active: "sales", title: "集計" });

let orders = [];
let currentNumber = 0;
let config = { ...DEFAULT_CONFIG };
let range = "today";

const RANGE_NOTE = {
  today: "本日発行した整理券を集計しています。",
  all:   "これまでに発行した整理券をすべて集計しています。",
};

requireStaff(() => {
  subscribeConfig((c) => { config = c; render(); });
  subscribeTicketState((s) => { currentNumber = s.currentNumber; });
  subscribeOrders((list) => {
    orders = list;
    updateNavBadges(orders, currentNumber);
    render();
  });
});

document.querySelectorAll("[data-range]").forEach((btn) => {
  btn.addEventListener("click", () => {
    range = btn.dataset.range;
    document.querySelectorAll("[data-range]").forEach((b) => b.classList.toggle("active", b === btn));
    render();
  });
});

// 本日かどうかは整理券を発行した時刻で判断する
function targetOrders() {
  if (range === "all") return orders;
  return orders.filter((o) => isToday(o.createdAt));
}

// 工程は後戻りしない前提で数える。
// 提供済みの整理券は食券も買っているので、購入の数にも含める。
function counts(list) {
  const is = (o, ...st) => st.includes(o.status);
  return {
    issued:    list.length,
    bought:    list.filter((o) => is(o, "purchased", "served")).length,
    served:    list.filter((o) => is(o, "served")).length,
    skipped:   list.filter((o) => is(o, "skipped")).length,
    cancelled: list.filter((o) => is(o, "cancelled")).length,
  };
}

function render() {
  const list = targetOrders();
  const c = counts(list);

  document.getElementById("range-note").textContent = RANGE_NOTE[range];
  document.getElementById("c-issued").textContent = c.issued;
  document.getElementById("c-bought").textContent = c.bought;
  document.getElementById("c-served").textContent = c.served;
  document.getElementById("c-skipped").textContent = c.skipped;
  document.getElementById("c-cancelled").textContent = c.cancelled;
  document.getElementById("served-stat").hidden = !config.useServed;

  renderFunnel(c);
  renderHourly(list);
}

function renderFunnel(c) {
  const rows = [
    { name: "整理券を発行", n: c.issued },
    { name: "食券を購入",   n: c.bought },
  ];
  if (config.useServed) rows.push({ name: "提供", n: c.served });

  const wrap = document.getElementById("funnel");
  wrap.innerHTML = "";

  if (c.issued === 0) {
    wrap.innerHTML = `<p class="empty">まだ整理券がありません</p>`;
    return;
  }

  rows.forEach((r) => {
    const pct = Math.round((r.n / c.issued) * 100);
    const el = document.createElement("div");
    el.className = "sales-row";
    el.innerHTML = `
      <div class="sales-head">
        <span class="sales-name">${esc(r.name)}</span>
        <span class="sales-qty">${r.n}<small>組</small></span>
      </div>
      <div class="sales-bar"><span style="width:${pct}%"></span></div>
      <div class="sales-sub">発行した ${c.issued} 組のうち <strong>${pct}%</strong></div>
    `;
    wrap.appendChild(el);
  });
}

function hourOf(ts) {
  return ts && ts.toDate ? ts.toDate().getHours() : null;
}

function renderHourly(list) {
  const wrap = document.getElementById("hourly");
  wrap.innerHTML = "";

  const map = new Map();
  list.forEach((o) => {
    if (o.status === "cancelled") return;
    const h = hourOf(o.purchasedAt);
    if (h === null) return;
    map.set(h, (map.get(h) || 0) + 1);
  });

  if (map.size === 0) {
    wrap.innerHTML = `<p class="empty">まだ食券が売れていません</p>`;
    return;
  }

  const hours = [...map.keys()].sort((a, b) => a - b);
  const max = Math.max(...map.values());

  hours.forEach((h) => {
    const n = map.get(h);
    const el = document.createElement("div");
    el.className = "sales-row";
    el.innerHTML = `
      <div class="sales-head">
        <span class="sales-name">${h}時台</span>
        <span class="sales-qty">${n}<small>組</small></span>
      </div>
      <div class="sales-bar"><span style="width:${Math.round((n / max) * 100)}%"></span></div>
    `;
    wrap.appendChild(el);
  });
}

// ===== CSV =====
function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

document.getElementById("csv-btn").addEventListener("click", () => {
  const list = targetOrders();
  if (list.length === 0) { toast("出力できる整理券がありません", "err"); return; }

  const c = counts(list);
  const rows = [
    ["整理券を発行", c.issued],
    ["食券を購入", c.bought],
  ];
  if (config.useServed) rows.push(["提供", c.served]);
  rows.push(["呼び飛ばし", c.skipped], ["取消", c.cancelled]);

  const lines = [["工程", "組数"].map(csvCell).join(",")];
  rows.forEach((r) => lines.push(r.map(csvCell).join(",")));

  // Excelで文字化けしないようUTF-8 BOMを付ける
  const csv = "﻿" + lines.join("\r\n");
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const name = `集計_${range === "today" ? "本日" : "全期間"}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`;

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
});
</script>

</body>
</html>
