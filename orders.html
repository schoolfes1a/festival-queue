<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提供リスト - 喫茶一瑛</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="staff-page">

<div id="shell"></div>

<main>

  <section class="card">
    <div class="card-header">
      <h2>提供リスト</h2>
      <label style="display:flex; align-items:center; gap:6px; font-weight:600; font-size:13px; margin:0;">
        <input type="checkbox" id="sound-toggle" style="width:auto;">
        新しい食券が売れたら音で知らせる
      </label>
    </div>

    <div class="tabbar" id="status-tabs">
      <button type="button" class="tab-btn active" data-filter="purchased">購入済み <span class="tab-badge" data-count="purchased" hidden>0</span></button>
      <button type="button" class="tab-btn" data-filter="served" id="tab-served">提供済み</button>
      <button type="button" class="tab-btn" data-filter="cancelled">キャンセル</button>
      <button type="button" class="tab-btn" data-filter="all">すべて</button>
    </div>

    <p class="note" id="filter-note"></p>
    <div class="board" id="order-board"></div>
  </section>

</main>

<!-- 備考の編集 -->
<div class="modal" id="edit-modal" hidden>
  <div class="modal-box">
    <h2 id="edit-title">備考を編集</h2>
    <label for="edit-note">備考</label>
    <textarea id="edit-note" rows="3" placeholder="アレルギー、まとめ会計など"></textarea>
    <div class="btn-row" style="margin-top:14px;">
      <button type="button" id="edit-save" class="green" style="flex:1;">保存</button>
      <button type="button" id="edit-cancel" class="ghost" style="flex:1;">閉じる</button>
    </div>
  </div>
</div>

<script type="module">
import {
  db, requireStaff, mountShell, subscribeOrders, subscribeTicketState, subscribeConfig, syncBoard, updateNavBadges, setOrderStatus, removeOrder, esc, statusLabel, fmtClock, toast, beep, createArrivalWatcher, effectiveStatus, DEFAULT_CONFIG
} from "./app.js";
import {
  doc, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { logOrder } from "./logger.js";

mountShell({ active: "orders", title: "提供リスト" });

let orders = [];
let staffEmail = null;
let currentNumber = 0;
let config = { ...DEFAULT_CONFIG };
let filter = "purchased";
let editing = null;
const newIds = new Set();

// 食券が売れた瞬間＝厨房が動き出すタイミングなので、ここを新着として拾う
const detectNewPurchased = createArrivalWatcher((o) => o.status === "purchased");

const soundToggle = document.getElementById("sound-toggle");
soundToggle.checked = localStorage.getItem("ordersSound") === "on";
soundToggle.addEventListener("change", () => {
  localStorage.setItem("ordersSound", soundToggle.checked ? "on" : "off");
  if (soundToggle.checked) beep(1);
});

const FILTER_NOTE = {
  purchased: "食券を買ったお客様です。お渡ししたら「提供済み」を押してください。",
  served:    "提供が終わった整理券です。",
  cancelled: "取り消した整理券です。",
  all:       "すべての整理券を新しい順に表示しています。",
};

requireStaff((user) => {
  staffEmail = user.email;

  subscribeConfig((c) => {
    config = c;
    applyServedVisibility();
    renderBoard();
  });

  subscribeTicketState((s) => {
    currentNumber = s.currentNumber;
    renderBoard();
  });

  subscribeOrders((list, snap) => {
    orders = list;
    const arrivals = detectNewPurchased(snap);
    arrivals.forEach((id) => {
      newIds.add(id);
      setTimeout(() => newIds.delete(id), 8000);
    });
    if (arrivals.length > 0 && soundToggle.checked) beep(2);

    updateNavBadges(orders, currentNumber);
    syncBoard(orders, currentNumber);
    renderCounts();
    renderBoard();
    if (editing && !orders.some((o) => o.id === editing.id)) {
      closeEdit();
      toast("編集中の整理券が他の端末で削除されました", "err");
    }
  });
});

// 「提供済み」を使わない設定のときは、その工程をUIから消す
function applyServedVisibility() {
  document.getElementById("tab-served").hidden = !config.useServed;
  if (!config.useServed && filter === "served") {
    filter = "purchased";
    document.querySelectorAll("#status-tabs .tab-btn").forEach((b) =>
      b.classList.toggle("active", b.dataset.filter === "purchased"));
  }
}

document.querySelectorAll("#status-tabs .tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    filter = btn.dataset.filter;
    document.querySelectorAll("#status-tabs .tab-btn").forEach((b) =>
      b.classList.toggle("active", b === btn));
    renderBoard();
  });
});

function renderCounts() {
  document.querySelectorAll("[data-count]").forEach((el) => {
    const n = orders.filter((o) => effectiveStatus(o, currentNumber) === el.dataset.count).length;
    el.textContent = n;
    el.hidden = n === 0;
  });
}

// ===== ボード =====
function visibleOrders() {
  const eff = (o) => effectiveStatus(o, currentNumber);
  const list = filter === "all" ? orders.slice() : orders.filter((o) => eff(o) === filter);
  // 先に来た人から順に処理するので、作業待ちは昇順
  if (filter === "purchased") {
    return list.sort((a, b) => Number(a.ticketNumber) - Number(b.ticketNumber));
  }
  return list.sort((a, b) => Number(b.ticketNumber) - Number(a.ticketNumber));
}

function actionsFor(order, eff) {
  const edit = `<button class="ghost small" data-edit="${order.id}">備考</button>`;
  const del  = `<button class="red small" data-delete="${order.id}">削除</button>`;

  if (eff === "purchased") {
    const serve = config.useServed
      ? `<button class="green" data-status="served" data-id="${order.id}">提供済みにする</button>` : "";
    return `${serve}${edit}
            <button class="red small" data-status="cancelled" data-id="${order.id}" data-confirm="この整理券を取り消しますか？">取消</button>`;
  }
  if (eff === "served") {
    return `<button class="ghost small" data-status="purchased" data-id="${order.id}">購入済みに戻す</button>${del}`;
  }
  if (eff === "cancelled") {
    return `<button class="ghost small" data-status="issued" data-id="${order.id}">受付に戻す</button>${del}`;
  }
  return del;
}

function renderBoard() {
  const board = document.getElementById("order-board");
  if (!board) return;
  document.getElementById("filter-note").textContent = FILTER_NOTE[filter] || "";

  const list = visibleOrders();
  board.innerHTML = "";

  if (list.length === 0) {
    board.innerHTML = `<p class="empty">対象の整理券はありません</p>`;
    return;
  }

  list.forEach((order) => {
    const eff = effectiveStatus(order, currentNumber);
    const card = document.createElement("div");
    card.className = `order-card is-${eff}${newIds.has(order.id) ? " is-new" : ""}`;
    card.innerHTML = `
      <div class="order-head">
        <div class="order-num">${esc(order.ticketNumber)}<small>番</small></div>
        <div class="order-meta">${statusLabel(eff)}<br>${fmtClock(order.purchasedAt || order.createdAt)}</div>
      </div>
      ${order.note ? `<div class="order-note">${esc(order.note)}</div>` : ""}
      <div class="order-actions">${actionsFor(order, eff)}</div>
    `;
    board.appendChild(card);
  });

  attachBoardEvents(board);
}

function attachBoardEvents(board) {
  const find = (id) => orders.find((o) => o.id === id);

  board.querySelectorAll("[data-status]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const order = find(btn.dataset.id);
      if (!order) return;
      if (btn.dataset.confirm && !confirm(`${order.ticketNumber}番：${btn.dataset.confirm}`)) return;
      setOrderStatus(order, btn.dataset.status, staffEmail);
    });
  });

  board.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const order = find(btn.dataset.delete);
      if (!order) return;
      if (confirm(`${order.ticketNumber}番を完全に削除します。元に戻せません。よろしいですか？`)) {
        removeOrder(order, staffEmail);
      }
    });
  });

  board.querySelectorAll("[data-edit]").forEach((btn) => {
    btn.addEventListener("click", () => openEdit(find(btn.dataset.edit)));
  });
}

// ===== 備考モーダル =====
// 商品は扱わないので、あとから足せるのは備考だけ。
function openEdit(order) {
  if (!order) return;
  editing = { id: order.id, ticketNumber: order.ticketNumber };
  document.getElementById("edit-title").textContent = `${order.ticketNumber}番の備考`;
  document.getElementById("edit-note").value = order.note || "";
  document.getElementById("edit-modal").hidden = false;
}

document.getElementById("edit-save").addEventListener("click", async () => {
  const note = document.getElementById("edit-note").value.trim();
  const btn = document.getElementById("edit-save");
  btn.disabled = true;
  try {
    await updateDoc(doc(db, "orders", editing.id), { note, updatedAt: serverTimestamp() });
    logOrder(staffEmail, editing.ticketNumber, "備考の編集", note);
    toast(`${editing.ticketNumber}番の備考を更新しました`);
    closeEdit();
  } catch (e) {
    console.error(e);
    toast("保存に失敗しました", "err");
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("edit-cancel").addEventListener("click", closeEdit);

function closeEdit() {
  editing = null;
  document.getElementById("edit-modal").hidden = true;
}
</script>

</body>
</html>
