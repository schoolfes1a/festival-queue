<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提供リスト - 1A文化祭</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="staff-page">

<div id="shell"></div>

<main>

  <section class="card">
    <div class="card-header">
      <h2>提供リスト</h2>
      <label style="display:flex; align-items:center; gap:6px; font-weight:600; font-size:13px; margin:0;">
        <input type="checkbox" id="sound-toggle" style="width:auto;">
        新しい食券が売れたら音で知らせる
      </label>
    </div>

    <div class="tabbar" id="status-tabs">
      <button type="button" class="tab-btn active" data-filter="purchased">入店待ち <span class="tab-badge" data-count="purchased" hidden>0</span></button>
      <button type="button" class="tab-btn" data-filter="entered">入店済み <span class="tab-badge" data-count="entered" hidden>0</span></button>
      <button type="button" class="tab-btn" data-filter="served" id="tab-served">提供済み</button>
      <button type="button" class="tab-btn" data-filter="cancelled">キャンセル</button>
      <button type="button" class="tab-btn" data-filter="all">すべて</button>
    </div>

    <p class="note" id="filter-note"></p>
    <div class="board" id="order-board"></div>
  </section>

</main>

<!-- 内容の修正 -->
<div class="modal" id="edit-modal" hidden>
  <div class="modal-box">
    <h2 id="edit-title">内容を修正</h2>
    <div id="edit-items"></div>
    <div class="inline-form" style="margin-top:10px;">
      <select id="edit-add-select"></select>
      <button type="button" id="edit-add-btn" class="green small">追加</button>
    </div>
    <div class="cart-total">
      <span>合計</span>
      <b id="edit-total">¥0</b>
    </div>
    <label for="edit-note" style="margin-top:8px;">備考</label>
    <textarea id="edit-note" rows="2"></textarea>
    <div class="btn-row" style="margin-top:14px;">
      <button type="button" id="edit-save" class="green" style="flex:1;">保存</button>
      <button type="button" id="edit-cancel" class="ghost" style="flex:1;">閉じる</button>
    </div>
  </div>
</div>

<script type="module">
import {
  db, requireStaff, mountShell, subscribeOrders, subscribeMenu, subscribeTicketState,
  subscribeConfig, syncBoard, updateNavBadges, setOrderStatus, removeOrder, enterAndAdvance,
  esc, yen, calcTotal, itemsHtml, statusLabel, fmtClock, toast, beep,
  createArrivalWatcher, formatItems, effectiveStatus, DEFAULT_CONFIG
} from "./app.js";
import {
  doc, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { logOrder } from "./logger.js";

mountShell({ active: "orders", title: "提供リスト" });

let orders = [];
let menuItems = [];
let staffEmail = null;
let currentNumber = 0;
let config = { ...DEFAULT_CONFIG };
let filter = "purchased";
let editing = null;
const newIds = new Set();

// 食券が売れた瞬間＝厨房が動き出すタイミングなので、ここを新着として拾う
const detectNewPurchased = createArrivalWatcher((o) => o.status === "purchased");

const soundToggle = document.getElementById("sound-toggle");
soundToggle.checked = localStorage.getItem("ordersSound") === "on";
soundToggle.addEventListener("change", () => {
  localStorage.setItem("ordersSound", soundToggle.checked ? "on" : "off");
  if (soundToggle.checked) beep(1);
});

const FILTER_NOTE = {
  purchased: "食券を買って、入店を待っている整理券です。席が空いたら「入店」を押してください。",
  entered:   "入店したお客様です。",
  served:    "提供が終わった整理券です。",
  cancelled: "取り消した整理券です。",
  all:       "すべての整理券を新しい順に表示しています。",
};

requireStaff((user) => {
  staffEmail = user.email;

  subscribeConfig((c) => {
    config = c;
    applyServedVisibility();
    renderBoard();
  });

  subscribeTicketState((s) => {
    currentNumber = s.currentNumber;
    renderBoard();
  });

  subscribeMenu((items) => {
    menuItems = items;
    renderEditSelect();
  });

  subscribeOrders((list, snap) => {
    orders = list;
    const arrivals = detectNewPurchased(snap);
    arrivals.forEach((id) => {
      newIds.add(id);
      setTimeout(() => newIds.delete(id), 8000);
    });
    if (arrivals.length > 0 && soundToggle.checked) beep(2);

    updateNavBadges(orders, currentNumber);
    syncBoard(orders, currentNumber);
    renderCounts();
    renderBoard();
    if (editing && !orders.some((o) => o.id === editing.id)) {
      closeEdit();
      toast("編集中の整理券が他の端末で削除されました", "err");
    }
  });
});

// 「提供済み」を使わない設定のときは、その工程をUIから消す
function applyServedVisibility() {
  document.getElementById("tab-served").hidden = !config.useServed;
  if (!config.useServed && filter === "served") {
    filter = "purchased";
    document.querySelectorAll("#status-tabs .tab-btn").forEach((b) =>
      b.classList.toggle("active", b.dataset.filter === "purchased"));
  }
}

document.querySelectorAll("#status-tabs .tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    filter = btn.dataset.filter;
    document.querySelectorAll("#status-tabs .tab-btn").forEach((b) =>
      b.classList.toggle("active", b === btn));
    renderBoard();
  });
});

function renderCounts() {
  document.querySelectorAll("[data-count]").forEach((el) => {
    const n = orders.filter((o) => effectiveStatus(o, currentNumber) === el.dataset.count).length;
    el.textContent = n;
    el.hidden = n === 0;
  });
}

// ===== ボード =====
function visibleOrders() {
  const eff = (o) => effectiveStatus(o, currentNumber);
  const list = filter === "all" ? orders.slice() : orders.filter((o) => eff(o) === filter);
  // 先に来た人から順に処理するので、作業待ちは昇順
  if (filter === "purchased" || filter === "entered") {
    return list.sort((a, b) => Number(a.ticketNumber) - Number(b.ticketNumber));
  }
  return list.sort((a, b) => Number(b.ticketNumber) - Number(a.ticketNumber));
}

function actionsFor(order, eff) {
  const edit = `<button class="ghost small" data-edit="${order.id}">修正</button>`;
  const del  = `<button class="red small" data-delete="${order.id}">削除</button>`;

  if (eff === "purchased") {
    return `<button class="green" data-enter="${order.id}">入店</button>${edit}
            <button class="red small" data-status="cancelled" data-id="${order.id}" data-confirm="この整理券を取り消しますか？">取消</button>`;
  }
  if (eff === "entered") {
    const serve = config.useServed
      ? `<button class="green" data-status="served" data-id="${order.id}">提供済みにする</button>` : "";
    return `${serve}${edit}<button class="ghost small" data-status="purchased" data-id="${order.id}">入店待ちに戻す</button>`;
  }
  if (eff === "served") {
    return `<button class="ghost small" data-status="entered" data-id="${order.id}">入店済みに戻す</button>${del}`;
  }
  if (eff === "cancelled") {
    return `<button class="ghost small" data-status="issued" data-id="${order.id}">受付に戻す</button>${del}`;
  }
  return del;
}

function renderBoard() {
  const board = document.getElementById("order-board");
  if (!board) return;
  document.getElementById("filter-note").textContent = FILTER_NOTE[filter] || "";

  const list = visibleOrders();
  board.innerHTML = "";

  if (list.length === 0) {
    board.innerHTML = `<p class="empty">対象の整理券はありません</p>`;
    return;
  }

  list.forEach((order) => {
    const eff = effectiveStatus(order, currentNumber);
    const card = document.createElement("div");
    card.className = `order-card is-${eff}${newIds.has(order.id) ? " is-new" : ""}`;
    card.innerHTML = `
      <div class="order-head">
        <div class="order-num">${esc(order.ticketNumber)}<small>番</small></div>
        <div class="order-meta">${statusLabel(eff)}<br>${fmtClock(order.purchasedAt || order.createdAt)}</div>
      </div>
      <div class="order-items">${itemsHtml(order.items)}</div>
      ${order.note ? `<div class="order-note">${esc(order.note)}</div>` : ""}
      <div class="order-total">${yen(calcTotal(order.items))}</div>
      <div class="order-actions">${actionsFor(order, eff)}</div>
    `;
    board.appendChild(card);
  });

  attachBoardEvents(board);
}

function attachBoardEvents(board) {
  const find = (id) => orders.find((o) => o.id === id);

  board.querySelectorAll("[data-enter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const order = find(btn.dataset.enter);
      if (!order) return;
      enterAndAdvance(order, staffEmail, config, currentNumber);
    });
  });

  board.querySelectorAll("[data-status]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const order = find(btn.dataset.id);
      if (!order) return;
      if (btn.dataset.confirm && !confirm(`${order.ticketNumber}番：${btn.dataset.confirm}`)) return;
      setOrderStatus(order, btn.dataset.status, staffEmail);
    });
  });

  board.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const order = find(btn.dataset.delete);
      if (!order) return;
      if (confirm(`${order.ticketNumber}番を完全に削除します。元に戻せません。よろしいですか？`)) {
        removeOrder(order, staffEmail);
      }
    });
  });

  board.querySelectorAll("[data-edit]").forEach((btn) => {
    btn.addEventListener("click", () => openEdit(find(btn.dataset.edit)));
  });
}

// ===== 修正モーダル =====
function renderEditSelect() {
  const select = document.getElementById("edit-add-select");
  select.innerHTML = "";
  menuItems.forEach((m) => {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = `${m.name}（${yen(m.price)}）`;
    select.appendChild(opt);
  });
}

function openEdit(order) {
  if (!order) return;
  editing = {
    id: order.id,
    ticketNumber: order.ticketNumber,
    items: (order.items || []).map((i) => ({ ...i })),
  };
  document.getElementById("edit-title").textContent = `${order.ticketNumber}番の内容を修正`;
  document.getElementById("edit-note").value = order.note || "";
  document.getElementById("edit-modal").hidden = false;
  renderEditItems();
}

function renderEditItems() {
  const wrap = document.getElementById("edit-items");
  wrap.innerHTML = "";

  if (editing.items.length === 0) {
    wrap.innerHTML = `<p class="empty">商品がありません</p>`;
  } else {
    editing.items.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "cart-row";
      row.innerHTML = `
        <span>${esc(item.name)}<br><small class="muted">${yen(item.price)} × ${item.qty} = ${yen(item.price * item.qty)}</small></span>
        <span class="qty-ctrl">
          <button type="button" class="gray" data-m="${idx}">−</button>
          <span class="cart-qty">${item.qty}</span>
          <button type="button" class="gray" data-p="${idx}">＋</button>
        </span>
      `;
      wrap.appendChild(row);
    });
    wrap.querySelectorAll("[data-p]").forEach((b) =>
      b.addEventListener("click", () => { editing.items[Number(b.dataset.p)].qty += 1; renderEditItems(); }));
    wrap.querySelectorAll("[data-m]").forEach((b) =>
      b.addEventListener("click", () => {
        const i = Number(b.dataset.m);
        editing.items[i].qty -= 1;
        if (editing.items[i].qty <= 0) editing.items.splice(i, 1);
        renderEditItems();
      }));
  }

  document.getElementById("edit-total").textContent = yen(calcTotal(editing.items));
}

document.getElementById("edit-add-btn").addEventListener("click", () => {
  const item = menuItems.find((m) => m.id === document.getElementById("edit-add-select").value);
  if (!item) return;
  const ex = editing.items.find((i) => i.itemId === item.id);
  if (ex) ex.qty += 1;
  else editing.items.push({ itemId: item.id, name: item.name, price: Number(item.price), qty: 1 });
  renderEditItems();
});

document.getElementById("edit-save").addEventListener("click", async () => {
  const note = document.getElementById("edit-note").value.trim();
  const btn = document.getElementById("edit-save");
  btn.disabled = true;
  try {
    await updateDoc(doc(db, "orders", editing.id), {
      items: editing.items,
      note,
      updatedAt: serverTimestamp(),
    });
    logOrder(
      staffEmail, editing.ticketNumber, "内容修正",
      formatItems(editing.items) + (note ? ` / 備考:${note}` : "")
    );
    toast(`${editing.ticketNumber}番の内容を更新しました`);
    closeEdit();
  } catch (e) {
    console.error(e);
    toast("保存に失敗しました", "err");
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("edit-cancel").addEventListener("click", closeEdit);

function closeEdit() {
  editing = null;
  document.getElementById("edit-modal").hidden = true;
}
</script>

</body>
</html>
